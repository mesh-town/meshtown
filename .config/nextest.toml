[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "15s", terminate-after = 4 }
final-status-level = "slow"
# On macOS, a test process can inherit the write end of another test's stdout/stderr pipe: the runner creates a pipe and
# marks it close-on-exec in two steps, and a test spawned in between keeps the pipe open until that test exits.
# The finished test is then reported as LEAK although it left nothing behind. Sibling tests mostly end within a
# second, so the wait is longer than the default 100 ms; a real leak (a thread or a child process that outlives the test)
# still shows up after it.
leak-timeout = "1s"

# The "64 MiB" case (hyper) takes a few seconds in the dev profile (dependencies are built with optimizations, see
# `[profile.dev.package."*"]` in Cargo.toml) and minutes under heavy machine load: that is slow, not hung. The limit
# is above VOLUME_LIMIT (100 s), so that the test's clear panic fires rather than a kill.
[[profile.default.overrides]]
filter = 'test(sixty_four_mebibytes_arrive_intact)'
slow-timeout = { period = "60s", terminate-after = 4 }
test-group = 'heavy-net'

# The "hundred streams" case (hyper) goes red with a timeout while opening a stream on an overloaded machine
# (green on a quiet one). The cause is the queue of
# incoming streams in townjump, not this test. Two retries: nextest
# marks the test FLAKY rather than red; a real breakage is red in all three attempts. The filter is by full
# name: the `mem` variant gets no retries.
[[profile.default.overrides]]
filter = 'test(=transport::net_hyper::contract_tests::transport::streams::hundred_streams_echo_every_byte)'
# A retry immediately hits the same load peak, so there is a pause before each retry.
retries = { backoff = "fixed", count = 2, delay = "30s" }

# Heavy transport cases run one at a time: next to the rest of the tests on a loaded machine they time out,
# alone they finish quickly. The "64 MiB" case joins the group in its own override above.
[test-groups]
heavy-net = { max-threads = 1 }
# Dials through a relay on a LAN-address cluster: the pairing needs a few seconds of quiet CPU, so these run one at a time.
lan-relay = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(hundred_streams_echo_every_byte)'
slow-timeout = { period = "60s", terminate-after = 4 }
test-group = 'heavy-net'

[[profile.default.overrides]]
filter = 'test(/relayed_dial_tests::|relay_admit_tests::|relay_contract_tests::|relay_path_tests::|relay_wiring::/)'
test-group = 'lan-relay'
