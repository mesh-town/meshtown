[package]
name = "meshtown-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "Mesh Town desktop app for windows: the node with the tray icon"

[lints]
workspace = true

[lib]
path = "gui/lib.rs"

[[bin]]
name = "meshtown-windows"
path = "cli/main.rs"

[target.'cfg(target_os = "windows")'.dependencies]
meshtown-core = { path = "../../core", features = ["gui"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
