[workspace]
resolver = "2"
members = ["core", "platforms/macos", "platforms/windows", "platforms/linux"]
default-members = ["core"]
# Scratch clones (for example the Android build's tun2proxy checkout) live under .tmp/ and are not members.
exclude = [".tmp"]

# Keep this the first table with a version line: release scripts read the first
# "version =" line of this file.
[workspace.package]
version = "0.3.84"
edition = "2021"
rust-version = "1.94"
publish = false
authors = ["Mesh Town <340663027+mesh-town@users.noreply.github.com>"]
repository = "https://github.com/mesh-town/meshtown"
homepage = "https://github.com/mesh-town/meshtown"
license = "AGPL-3.0-only"

# The code layout ratchet: the function length threshold is in clippy.toml,
# lowered after each group of splits down to 50.
[workspace.lints.clippy]
too_many_lines = "warn"

# Dependencies are optimized in dev and test builds: unoptimized crypto and transport make handshakes so slow that
# the network tests time out on modest CPUs. The crate's own code stays unoptimized for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Build with symbols for `jeprof` (platforms/linux/build/build.sh, HEAP_PROF=1); `[profile.release]` is not affected.
[profile.release-sym]
inherits = "release"
strip = false
debug = "line-tables-only"
