name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-tag:
    name: check tag matches Cargo.toml
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag and package version
        id: v
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "cannot read version from Cargo.toml" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: check-tag
    uses: ./.github/workflows/build-targets.yml
    with:
      version: ${{ needs.check-tag.outputs.version }}
      # armv7 is the console build for the OpenWrt package feed (arm_cortex-* labels); soft-float, no tray build.
      # A failed armv7 build must not stop the release; the feed job reports the missing archive.
      targets: |
        [
          {"target": "aarch64-apple-darwin", "os": "macos-26", "zig": false},
          {"target": "x86_64-apple-darwin", "os": "macos-26", "zig": false},
          {"target": "x86_64-unknown-linux-musl", "os": "ubuntu-24.04", "zig": true},
          {"target": "aarch64-unknown-linux-musl", "os": "ubuntu-24.04", "zig": true},
          {"target": "armv7-unknown-linux-musleabi", "os": "ubuntu-24.04", "zig": true, "cli_only": true, "optional": true},
          {"target": "mipsel-unknown-linux-musl", "os": "ubuntu-24.04", "zig": false, "mips": true, "cli_only": true, "optional": true},
          {"target": "mips-unknown-linux-musl", "os": "ubuntu-24.04", "zig": false, "mips": true, "cli_only": true, "optional": true},
          {"target": "x86_64-pc-windows-msvc", "os": "windows-latest", "zig": false}
        ]

  # Kept while older nodes look up the latest version in this repository.
  publish:
    name: publish release
    needs: [check-tag, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-tag.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          # The installer job may finish before this one; the installer ships only with the dist release.
          rm -f meshtown-setup-*.exe
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          # The Homebrew tap reads exactly these lines: "<sha256>  <name>".
          grep -q "  MeshTown-macos-arm64-${VERSION}.zip$" SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes

  windows-installer:
    name: Windows installer
    needs: [check-tag, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: asset-x86_64-pc-windows-msvc
          path: win
      - name: Build the installer
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nsis
          unzip -q "win/meshtown-${VERSION}-x86_64-pc-windows-msvc.zip" -d unpacked
          mkdir -p out
          DIST="$PWD/out" platforms/windows/build/installer.sh "unpacked/meshtown-${VERSION}-x86_64-pc-windows-msvc/meshtown.exe"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: asset-windows-installer
          path: out/meshtown-setup-${{ needs.check-tag.outputs.version }}.exe
          if-no-files-found: error

  dist-release:
    name: release in the distribution repository
    needs: [check-tag, build, windows-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      repo: ${{ steps.release.outputs.repo }}
    env:
      VERSION: ${{ needs.check-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          merge-multiple: true
          path: assets
      - name: Checksums
        working-directory: assets
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz *.zip *.exe > SHA256SUMS
          # The Homebrew tap reads exactly these lines: "<sha256>  <name>".
          grep -q "  MeshTown-macos-arm64-${VERSION}.zip$" SHA256SUMS
          grep -q "  meshtown-setup-${VERSION}.exe$" SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ secrets.DIST_TOKEN }}
        run: scripts/release/dist/release.sh assets "$VERSION"

  openwrt-feed:
    name: OpenWrt package feed
    needs: [check-tag, publish, dist-release]
    permissions:
      contents: read
    uses: ./.github/workflows/openwrt-feed.yml
    with:
      tag: ${{ github.ref_name }}
      release_repo: ${{ needs.dist-release.outputs.repo }}
      pkg_release: "1"
      strict: true
    secrets: inherit

  keenetic-feed:
    name: Keenetic (Entware) package feed
    needs: [check-tag, publish, dist-release]
    permissions:
      contents: read
    uses: ./.github/workflows/keenetic-feed.yml
    with:
      tag: ${{ github.ref_name }}
      release_repo: ${{ needs.dist-release.outputs.repo }}
      pkg_release: "1"
    secrets: inherit

  container-image:
    name: Container image
    needs: [check-tag, dist-release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-image.yml
    with:
      tag: ${{ github.ref_name }}
      release_repo: ${{ needs.dist-release.outputs.repo }}
      push: true
    secrets: inherit

  android:
    name: Android APK
    needs: [check-tag, publish]
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ github.ref_name }}
      publish: false
    secrets: inherit

  dist:
    name: Distribution repository
    needs: [check-tag, publish, android, windows-installer]
    # A failed Android build must not stop the other systems: android/ is then left as it is.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency: meshtown-dist
    env:
      VERSION: ${{ needs.check-tag.outputs.version }}
      DIST_DEPLOY_KEY: ${{ secrets.DIST_DEPLOY_KEY }}
      DIST_APT_KEY: ${{ secrets.DIST_APT_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apk
          path: apk
      - name: Publish to mesh-town/meshtown-dist
        run: |
          set -euo pipefail
          if [ -z "$DIST_DEPLOY_KEY" ]; then
            echo "::notice::DIST_DEPLOY_KEY is not set; nothing is published"
            exit 0
          fi
          win=x86_64-pc-windows-msvc
          mkdir -p dist-src/macos dist-src/windows dist-src/linux unpacked
          for arch in arm64 x86_64; do
            cp "assets/MeshTown-macos-${arch}-${VERSION}.zip" dist-src/macos/
          done
          unzip -q "assets/meshtown-${VERSION}-${win}.zip" -d unpacked
          unzip -q "assets/meshtown-cli-${VERSION}-${win}.zip" -d unpacked
          cp "unpacked/meshtown-${VERSION}-${win}/meshtown.exe" "dist-src/windows/meshtown-${VERSION}.exe"
          cp "unpacked/meshtown-cli-${VERSION}-${win}/meshtown-cli.exe" "dist-src/windows/meshtown-cli-${VERSION}.exe"
          cp "assets/meshtown-setup-${VERSION}.exe" "dist-src/windows/meshtown-setup-${VERSION}.exe"
          for arch in x86_64 aarch64; do
            cp "assets/meshtown-${VERSION}-${arch}-unknown-linux-musl.tar.gz" "dist-src/linux/meshtown-linux-${arch}-${VERSION}.tar.gz"
            cp "assets/meshtown-cli-${VERSION}-${arch}-unknown-linux-musl.tar.gz" "dist-src/linux/meshtown-cli-linux-${arch}-${VERSION}.tar.gz"
          done
          umask 077
          apt_key="$RUNNER_TEMP/apt-key.asc"
          if [ -z "$DIST_APT_KEY" ]; then
            echo "::notice::DIST_APT_KEY is not set; the apt repository is not updated"
          else
            printf '%s\n' "$DIST_APT_KEY" > "$apt_key"
            export MESHTOWN_APT_KEY="$apt_key"
            scripts/release/dist/build_debs.sh assets dist-src/linux/debian "$VERSION"
          fi
          if [ -f "apk/meshtown-${VERSION}.apk" ] && [ -f apk/signed.txt ]; then
            mkdir dist-src/android
            cp "apk/meshtown-${VERSION}.apk" dist-src/android/
          else
            echo "::notice::no signed APK: android/ is not updated"
          fi
          key="$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$DIST_DEPLOY_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          scripts/release/dist/publish.sh dist-src "$VERSION"
          rm -f "$key" "$apt_key"

  tap:
    name: notify Homebrew tap
    needs: [check-tag, publish, dist-release]
    if: needs.dist-release.outputs.repo == 'mesh-town/meshtown-dist'
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      VERSION: ${{ needs.check-tag.outputs.version }}
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - name: Dispatch release event to the tap
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::TAP_TOKEN is not set; the Homebrew tap is not notified"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mesh-town/homebrew-macos/dispatches \
            -d "{\"event_type\":\"release\",\"client_payload\":{\"version\":\"${VERSION}\"}}"

  winget:
    name: winget pull request
    needs: [check-tag, dist-release]
    if: needs.dist-release.outputs.repo == 'mesh-town/meshtown-dist'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check-tag.outputs.version }}
      # A classic token with the public_repo scope; komac opens the pull request in microsoft/winget-pkgs with it.
      GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
      KOMAC_VERSION: "2.17.1"
      KOMAC_SHA256: e694e79cd451afabf47bead66ed34586fef4814f7b94e4b61a098f419978d5d7
    steps:
      - uses: actions/checkout@v4
      - name: Install komac
        if: env.GITHUB_TOKEN != ''
        run: |
          set -euo pipefail
          name="komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$name" "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/$name"
          echo "${KOMAC_SHA256}  $RUNNER_TEMP/$name" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/komac"
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP/komac"
          bin="$(find "$RUNNER_TEMP/komac" -type f -name komac | head -n 1)"
          chmod +x "$bin"
          dirname "$bin" >> "$GITHUB_PATH"
      - name: Open the pull request
        run: scripts/release/winget/winget.sh submit "$VERSION"
