name: container-image

# Builds the OCI image of the node (linux/arm64, linux/amd64 and, when the release has it, linux/arm/v7) from the
# binaries of a release or of this run. On a release tag with push enabled the image goes to ghcr.io and the
# per-architecture tars are attached to the release; otherwise the run is dry and only uploads an artifact.
# There is no permissions key on purpose: a called workflow inherits the permissions of the calling job.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v0.2.7
        required: true
        type: string
      release_repo:
        description: Repository whose release holds the binaries
        required: false
        type: string
        default: mesh-town/meshtown-dist
      from_artifacts:
        description: Take the binaries from the asset-* artifacts of this run instead of a release
        required: false
        type: boolean
        default: false
      push:
        description: Publish the image and attach the tars (only on a v* tag)
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.7
        required: true
        type: string
      release_repo:
        description: Repository whose release holds the binaries
        required: false
        type: string
        default: mesh-town/meshtown-dist

jobs:
  image:
    name: build the container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check inputs
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag must look like v1.2.3" >&2
            exit 1
          fi
      - name: Tests of the image builder
        env:
          MESHTOWN_IMAGE_REQUIRE_SKOPEO: "1"
        run: python3 -m unittest discover -v -s platforms/linux/build/container -t platforms/linux/build/container
      - name: Download the release binaries
        if: ${{ !inputs.from_artifacts }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_REPO: ${{ inputs.release_repo || github.repository }}
        run: |
          set -euo pipefail
          mkdir -p fetched
          gh release download "$TAG" --repo "$RELEASE_REPO" --dir fetched \
            --pattern 'meshtown-cli-*-linux-musl*.tar.gz' --pattern SHA256SUMS
          (cd fetched && sha256sum -c --ignore-missing SHA256SUMS)
      - name: Download the binaries built in this run
        if: ${{ inputs.from_artifacts }}
        uses: actions/download-artifact@v4
        with:
          pattern: asset-*-linux-musl*
          merge-multiple: true
          path: fetched
      - name: Build the image
        env:
          TAG: ${{ inputs.tag }}
        run: python3 platforms/linux/build/container/build_image.py --fetched fetched --version "${TAG#v}" --out image
      - name: Inspect the image
        env:
          TAG: ${{ inputs.tag }}
        run: skopeo inspect --raw "oci:image/oci:${TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: image/
          if-no-files-found: error
      - name: Push to GHCR
        if: ${{ inputs.push && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/meshtown
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          jq -r '.manifests[].annotations["org.opencontainers.image.ref.name"]' image/oci/index.json |
            while IFS= read -r ref; do
              skopeo copy --all --preserve-digests "oci:image/oci:$ref" "docker://$IMAGE:$ref"
            done
          skopeo copy --all --preserve-digests "oci:image/oci:${TAG#v}" "docker://$IMAGE:latest"
      - name: Attach tars to the release
        if: ${{ inputs.push && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.DIST_TOKEN }}
          TAG: ${{ inputs.tag }}
          RELEASE_REPO: ${{ inputs.release_repo || github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DIST_TOKEN is not set: the tars are not attached to the release"
            exit 0
          fi
          gh release upload "$TAG" image/*.tar image/*.sha256sums --repo "$RELEASE_REPO" --clobber
