name: keenetic-feed

# Builds the opkg feed for Keenetic routers with Entware (mipsel, mips, aarch64) from the binaries of a published
# release and, when the deploy key is set up, publishes it to https://mesh-town.github.io/meshtown-keenetic.
# Without the deploy key the feed is only uploaded as an artifact.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v0.3.30
        required: true
        type: string
      pkg_release:
        description: Package release number (-rN); 1 for a new version
        required: false
        type: string
        default: "1"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.3.30
        required: true
        type: string
      pkg_release:
        description: Package release number (-rN); 1 for a new version
        required: false
        type: string
        default: "1"

permissions:
  contents: read

jobs:
  feed:
    name: build and publish the feed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check inputs
        env:
          TAG: ${{ inputs.tag }}
          PKG_RELEASE: ${{ inputs.pkg_release }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag must look like v1.2.3" >&2
            exit 1
          fi
          if ! printf '%s' "$PKG_RELEASE" | grep -Eq '^[1-9][0-9]*$'; then
            echo "pkg_release must be a positive integer" >&2
            exit 1
          fi
      - name: Tests of the feed builder
        run: python3 -m unittest discover -v -s platforms/linux/build/keenetic/feed -t platforms/linux/build/keenetic/feed
      - name: Download the release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p fetched
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir fetched \
            --pattern 'meshtown-cli-*-linux-musl.tar.gz' --pattern SHA256SUMS
          (cd fetched && sha256sum -c --ignore-missing SHA256SUMS)
      - name: Unpack the binaries
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p bins
          args=()
          for triple in mipsel-unknown-linux-musl mips-unknown-linux-musl aarch64-unknown-linux-musl; do
            base="meshtown-cli-${version}-${triple}"
            if [ ! -f "fetched/${base}.tar.gz" ]; then
              echo "::notice::release ${TAG} has no ${base}.tar.gz; that architecture is skipped"
              continue
            fi
            mkdir -p "bins/${triple}"
            tar -xzf "fetched/${base}.tar.gz" -C "bins/${triple}"
            args+=(--bin "${triple}=bins/${triple}/${base}/meshtown-cli")
          done
          if [ "${#args[@]}" -eq 0 ]; then
            echo "::error::no target archives found"
            exit 1
          fi
          printf '%s\n' "${args[@]}" > bin-args.txt
      - name: Build the feed
        env:
          TAG: ${{ inputs.tag }}
          PKG_RELEASE: ${{ inputs.pkg_release }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r line; do args+=("$line"); done < bin-args.txt
          python3 platforms/linux/build/keenetic/feed/build_feed.py --out feed --version "${TAG#v}" \
            --pkg-release "$PKG_RELEASE" --base-url https://mesh-town.github.io/meshtown-keenetic "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: keenetic-feed
          path: feed
          if-no-files-found: error
          include-hidden-files: true
      - name: Publish to mesh-town/meshtown-keenetic
        env:
          KEENETIC_DEPLOY_KEY: ${{ secrets.KEENETIC_DEPLOY_KEY }}
          TAG: ${{ inputs.tag }}
          PKG_RELEASE: ${{ inputs.pkg_release }}
        run: |
          set -euo pipefail
          if [ -z "$KEENETIC_DEPLOY_KEY" ]; then
            echo "Deploy key is not set: nothing is published."
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$KEENETIC_DEPLOY_KEY" > "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          platforms/linux/build/openwrt/feed/publish.sh feed git@github.com:mesh-town/meshtown-keenetic.git "${TAG#v}-r${PKG_RELEASE}"
          rm -f "$key"
