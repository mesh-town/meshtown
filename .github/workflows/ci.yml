name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MSRV: "1.94"
  # Toolchain of the test job and of its clippy run, pinned so that a new Rust release cannot turn `-D warnings` red
  # without a change in the repository. Bump it deliberately and fix the new lints in the same commit.
  CLIPPY_RUST: "1.99.1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test must not hold a runner for the default six hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # The Windows image sets core.autocrlf=true, which would check text files out with CRLF,
      # while golden files are compared with program output byte for byte. Must run before checkout.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install "$CLIPPY_RUST" --profile minimal --component clippy --component rustfmt
          rustup default "$CLIPPY_RUST"
      - uses: Swatinem/rust-cache@v2
      # `crate-type = ["rlib", "dylib"]` is only for the fast local loop on macOS; a dylib hits the PE export
      # table limit on Windows, so the manifest of the Windows runner is built without it (release builds do the same).
      - name: Build without dylib (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: sed -i '/^crate-type = /d' core/Cargo.toml
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (no tray)
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked --no-default-features --features net-hyper -- -D warnings
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Test
        run: cargo nextest run --workspace --locked

  web:
    name: web (page, browser battery)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            core/web_gui/ui/vue/package-lock.json
            core/web_gui/e2e/package-lock.json
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      # The committed bundle core/web_gui/ui/bundle/app.js must be what core/web_gui/ui/vue builds.
      - name: Bundle is fresh
        run: make web-bundle-check
      - name: Page tests and types
        run: make test-js web-typecheck test-py
      - name: Browser dependencies
        run: |
          make web-deps
          cd core/web_gui/e2e && node_modules/.bin/playwright install-deps chromium
      - name: Browser battery
        run: make web-check
      - name: Lint and types of the battery
        run: make web-check-lint

  android-unit:
    name: android (JVM unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships the Android SDK ($ANDROID_HOME); the tests need only android.jar from it,
      # no emulator, NDK or Rust.
      - name: JVM unit tests
        run: make android-test

  boundary:
    name: core/platform boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Boundary
        run: make boundary

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain
        run: rustup toolchain install "$MSRV" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ env.MSRV }}
      - name: Check
        run: cargo "+$MSRV" check --workspace --all-targets --locked

  openwrt-feed:
    name: openwrt-feed (builder tests, smoke build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MESHTOWN_APK: ${{ github.workspace }}/.tools/bin/apk
      MESHTOWN_USIGN: ${{ github.workspace }}/.tools/bin/usign
      MESHTOWN_FEED_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libssl-dev zlib1g-dev libzstd-dev fakeroot
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: openwrt-feed-tools-${{ runner.os }}-${{ hashFiles('platforms/linux/build/openwrt/feed/tools.sh') }}
      - name: Build apk and usign
        run: platforms/linux/build/openwrt/feed/tools.sh "$GITHUB_WORKSPACE/.tools"
      - name: Tests of the feed builder
        run: fakeroot python3 -m unittest discover -v -s platforms/linux/build/openwrt/feed -t platforms/linux/build/openwrt/feed
      - name: Smoke build of a feed
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fake"
          (cd platforms/linux/build/openwrt/feed && python3 -c "
          import sys
          from pathlib import Path
          from feed_fixtures import fake_elf
          d = Path(sys.argv[1])
          fake_elf(d / 'aarch64', 'aarch64')
          fake_elf(d / 'x86_64', 'x86_64')
          " "$RUNNER_TEMP/fake")
          fakeroot python3 platforms/linux/build/openwrt/feed/build_feed.py --out "$RUNNER_TEMP/feed" --version 0.0.1 \
            --base-url https://feed.example.invalid \
            --bin "aarch64-unknown-linux-musl=$RUNNER_TEMP/fake/aarch64" \
            --bin "x86_64-unknown-linux-musl=$RUNNER_TEMP/fake/x86_64" \
            --ephemeral-keys
